# ── IBM MQ connection parameters ────────────────────────────────────────────
# Uncomment ccdt-url to use CCDT instead of connection-list (mutually exclusive)
# file:../ccdt/ccdt.nativeha.json  for Native HA — use with queue-manager QM1
# file:../ccdt/ccdt.cluster.json   for Native HA + Cluster — use with queue-manager *UNIQA
#ibm.mq.ccdt-url=file:../ccdt/ccdt.cluster.json
ibm.mq.connection-list=host.containers.internal(1414),host.containers.internal(1415),host.containers.internal(1416)
ibm.mq.application-name=all-in-one
ibm.mq.channel=DEV.APP.SVRCONN
#ibm.mq.queue-manager=*UNIQA
ibm.mq.queue-manager=QM1
ibm.mq.username=app
ibm.mq.password=passw0rd
ibm.mq.queue=DEV.DEMO.QL.IN
ibm.mq.client-reconnect-timeout=5
# Consumer idle pulse (seconds). When the queue is empty the consumer sleeps
# this long between non-blocking receiveNoWait() calls; during that sleep the
# instance is MOVABLE, so the uniform cluster can rebalance the connection.
# Must stay above the queue manager's BALTIMEOUT (balance timeout, default 10s)
# so a movable window outlasts it. 15 ~= 1.5x BALTIMEOUT: margin for reliable
# balancing, worst-case idle message-pickup latency ~15s. If BALANCED stays NO,
# raise it (or lower BALTIMEOUT on the QM to allow a shorter pulse).
#   BALTIMEOUT: https://www.ibm.com/docs/en/ibm-mq/9.4.x?topic=objects-baltimeout
#   Check state: echo "DIS APSTATUS('<appltag>') TYPE(APPL)" | runmqsc <qmgr>   # watch BALANCED / MOVCOUNT
#   APSTATUS:   https://www.ibm.com/docs/en/ibm-mq/9.4.x?topic=reference-display-apstatus-display-application-status-multiplatforms
ibm.mq.consumer-pulse-interval=15

# Logging
# Set a specific package to DEBUG
quarkus.log.category."com.example.resource.InfoResource".level=INFO

mp.messaging.outgoing.mq-put.connector=smallrye-jms
mp.messaging.outgoing.mq-put.destination=${ibm.mq.queue}
mp.messaging.outgoing.mq-put.destination-type=queue

# ── Micrometer / Prometheus
quarkus.micrometer.export.prometheus.enabled=true

# ── Quarkus HTTP port 
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization
