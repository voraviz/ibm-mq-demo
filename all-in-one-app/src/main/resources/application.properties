# ── IBM MQ connection parameters ────────────────────────────────────────────
# Uncomment ccdt-url to use CCDT instead of connection-list (mutually exclusive)
# file:../ccdt/ccdt.nativeha.json  for Native HA — use with queue-manager QM1
# file:../ccdt/ccdt.cluster.json   for Native HA + Cluster — use with queue-manager *UNIQA
#ibm.mq.ccdt-url=file:../ccdt/ccdt.cluster.json
ibm.mq.connection-list=localhost(1414),localhost(1415),localhost(1416)
ibm.mq.application-name=all-in-one
ibm.mq.channel=DEV.APP.SVRCONN
#ibm.mq.queue-manager=*UNIQA
ibm.mq.queue-manager=QM1
ibm.mq.username=app
ibm.mq.password=passw0rd
ibm.mq.queue=DEV.DEMO.QL.IN
# How long (seconds) Layer 1 (WMQ_CLIENT_RECONNECT) keeps retrying a broken
# connection across all hosts before giving up and surfacing the error to the
# app, which then falls back to the Layer-2 reconnect loop. This is the TOTAL
# reconnect window, not a per-attempt cap. IBM's default is 1800 s (30 min);
# 900 s (15 min) gives HA/cluster failover ample time to complete transparently
# before the app-level fallback ever kicks in.
ibm.mq.client-reconnect-timeout=900
# Uniform-cluster application balancing timeout (BALTIMEOUT), in seconds. How long
# MQ waits for the app to reach a transaction/delivery boundary before forcing a
# rebalance move. Optional — defaults to 10s (IBM default) if omitted.
ibm.mq.balancing-timeout=10


# Logging
# Set a specific package to DEBUG
quarkus.log.category."com.example.resource.InfoResource".level=INFO
quarkus.log.category."com.example.config.MQConnectionFactoryProducer".level=DEBUG
# JMS Config
mp.messaging.outgoing.mq-put.connector=smallrye-jms
mp.messaging.outgoing.mq-put.destination=${ibm.mq.queue}
mp.messaging.outgoing.mq-put.destination-type=queue

# ── Micrometer / Prometheus
quarkus.micrometer.export.prometheus.enabled=true

# ── OpenTelemetry
# OFF by default. quarkus.otel.enabled is BUILD TIME, so the OTEL build is
# produced with the 'otel' profile (see application-otel.properties):
#   mvn package -Dquarkus.profile=otel
#   mvn quarkus:dev -Dquarkus.profile=otel
quarkus.otel.enabled=false


# ── Quarkus HTTP port 
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization
