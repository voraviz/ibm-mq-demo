# OTEL profile — layered on top of application.properties.
# Build/run with: -Dquarkus.profile=otel
#   mvn quarkus:dev -Dquarkus.profile=otel
#   mvn package     -Dquarkus.profile=otel     # then java -jar target/quarkus-app/quarkus-run.jar

# Build-time: wire OpenTelemetry into this build.
quarkus.otel.enabled=true
quarkus.application.name=all-in-one
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
#quarkus.otel.exporter.otlp.headers=authorization=Bearer my_secret
#quarkus.otel.metrics.enabled=false
#quarkus.otel.logs.enabled=false
# Trace IDs in console logs.
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n
