global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # obs-app/api — Quarkus Micrometer metrics
  - job_name: 'ibm-mq-obs-api'
    static_configs:
      - targets: ['host.containers.internal:8082']
    metrics_path: /q/metrics

  # IBM MQ built-in Prometheus exporter
  - job_name: 'ibm-mq'
    static_configs:
      - targets: ['host.containers.internal:9157']
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
