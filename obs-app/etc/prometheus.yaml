global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Quarkus Micrometer metrics
  - job_name: 'ibm-mq-obs-api'
    static_configs:
      - targets: ['host.containers.internal:8080']
    metrics_path: /q/metrics

  # mq-metric-samples exporter: per-queue metrics (ibmmq_queue_depth etc.) that
  # the built-in exporters lack. Single target — it connects as a client and
  # follows the active Native HA node across failover, so no per-node scrape.
  # Port 9157 is the container-internal port (host-mapped to 9257); Prometheus
  # is on mq-ha-net so it uses the internal port.
  - job_name: 'mq-exporter'
    static_configs:
      - targets: ['mq-exporter:9157']
    metrics_path: /metrics
    scheme: http

  # IBM MQ built-in Prometheus exporter - mq-node-1
  - job_name: 'mq-node-1'
    static_configs:
      - targets: ['mq-node-1:9157']
    metrics_path: /metrics
    scheme: http
    # tls_config:
    #   insecure_skip_verify: true

  # IBM MQ built-in Prometheus exporter - mq-node-2
  - job_name: 'mq-node-2'
    static_configs:
      - targets: ['mq-node-2:9157']
    metrics_path: /metrics
    scheme: http

  # IBM MQ built-in Prometheus exporter - mq-node-3
  - job_name: 'mq-node-3'
    static_configs:
      - targets: ['mq-node-3:9157']
    metrics_path: /metrics
    scheme: http

  # IBM MQ built-in Prometheus exporter - mq-node-4
  - job_name: 'mq-node-4'
    static_configs:
      - targets: ['mq-node-4:9157']
    metrics_path: /metrics
    scheme: http

  # IBM MQ built-in Prometheus exporter - mq-node-5
  - job_name: 'mq-node-5'
    static_configs:
      - targets: ['mq-node-5:9157']
    metrics_path: /metrics
    scheme: http

  # IBM MQ built-in Prometheus exporter - mq-node-6
  - job_name: 'mq-node-6'
    static_configs:
      - targets: ['mq-node-6:9157']
    metrics_path: /metrics
    scheme: http