# ── IBM MQ connection parameters ────────────────────────────────────────────
ibm.mq.connection-list=localhost(1414),localhost(1415),localhost(1416)
ibm.mq.host=localhost
ibm.mq.port=1414
ibm.mq.channel=DEV.APP.SVRCONN
ibm.mq.queue-manager=MYQMGR
ibm.mq.username=app
ibm.mq.password=passw0rd
ibm.mq.queue=DEV.QUEUE.1

# ── SmallRye Reactive Messaging — JMS channel bindings ──────────────────────
mp.messaging.outgoing.mq-put.connector=smallrye-jms
mp.messaging.outgoing.mq-put.destination=${ibm.mq.queue}
mp.messaging.outgoing.mq-put.destination-type=queue

# ── Micrometer / Prometheus ──────────────────────────────────────────────────
quarkus.micrometer.export.prometheus.enabled=true

# ── OpenTelemetry — OTLP exporter → OTEL Collector → Jaeger ─────────────────
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.service.name=ibm-mq-obs-api
#OpenTelemetry
quarkus.application.name=todo 
quarkus.otel.enabled=true
#quarkus.opentelemetry.tracer.exporter.otlp.headers=Authorization=Bearer my_secret 


# ── HTTP / CORS ──────────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization

# ── Quarkus HTTP port ────────────────────────────────────────────────────────
quarkus.http.port=8082

#  Log
quarkus.http.access-log.enabled=true
#quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" "traceId=%{X,traceId}" "parentId=%X{parentId}" "spanId=%X{spanId}" "sampled=%X{sampled}"
quarkus.http.access-log.pattern==%h %l %u %t "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" traceId=%{X,traceId} spanId=%{X,spanId}
#quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n 
quarkus.log.console.format=%d{HH:mm:ss} [%c{2.}] (%t) %s%e%n 